# Full production stack: nginx (LB) -> agent xN -> redis
# Run:   docker compose up --scale agent=3
# Test:  curl http://localhost/health

services:
  agent:
    build: .
    # no container_name: required for --scale agent=3
    expose:
      - 8000          # internal only — public traffic goes through nginx
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    env_file:
      - .env          # AGENT_API_KEY lives here, outside git
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      # host port configurable so local testing can avoid conflicts (default 80)
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
