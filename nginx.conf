# Nginx — reverse proxy & load balancer for the agent stack

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS round-robins across scaled replicas of the
    # `agent` service (docker compose up --scale agent=3).
    upstream agent_backend {
        server agent:8000;
        keepalive 32;
    }

    # IP-level rate limit (defense in depth — the app also limits per user)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;

        # Security headers
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        server_tokens off;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;   # LLM calls can be slow
        }

        # Health checks: no rate limit, no access log noise
        location /health {
            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too many requests"}';
        }
    }
}
